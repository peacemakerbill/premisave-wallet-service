<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Premisave Wallet Console</title>
<style>
:root {
  color-scheme: light;
  --bg: #f4f5f7;
  --surface: #ffffff;
  --surface-2: #f8f9fb;
  --sunken: #eef0f4;
  --ink: #0f172a;
  --ink-2: #475467;
  --ink-3: #8792a2;
  --line: #e4e7ec;
  --line-2: #d0d5dd;
  --accent: #2d5bff;
  --accent-ink: #ffffff;
  --side: #0e1a33;
  --side-2: #16264a;
  --side-ink: #d5dcec;
  --side-ink-2: #7f8cab;
  --good: #11805a;
  --bad: #c0261d;
  --warn: #9a5b00;
  --info: #1d5fd1;
  --code-bg: #0b1220;
  --code-ink: #d6deee;
  --ring: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
  --shadow: 0 1px 2px rgba(15, 23, 42, .05);
  --pop: 0 12px 32px rgba(15, 23, 42, .18);
  --sans: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "JetBrains Mono", "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0a0e15;
  --surface: #111722;
  --surface-2: #151c29;
  --sunken: #0d121b;
  --ink: #e6eaf2;
  --ink-2: #9aa5b8;
  --ink-3: #667085;
  --line: #1e2736;
  --line-2: #2a3548;
  --accent: #7c9bff;
  --accent-ink: #0a1020;
  --side: #0c111b;
  --side-2: #151d2c;
  --side-ink: #cfd7e6;
  --side-ink-2: #6f7c95;
  --good: #3ddc9b;
  --bad: #ff8a80;
  --warn: #f2b84b;
  --info: #7fb2ff;
  --code-bg: #080c13;
  --code-ink: #d2dbec;
  --shadow: none;
  --pop: 0 12px 32px rgba(0, 0, 0, .55);
}
/* accent palettes, light then dark */
:root[data-accent="emerald"] { --accent: #0b8f66; }
:root[data-accent="violet"] { --accent: #6a4dff; }
:root[data-accent="graphite"] { --accent: #1f2937; }
:root[data-theme="dark"][data-accent="blue"] { --accent: #7c9bff; }
:root[data-theme="dark"][data-accent="emerald"] { --accent: #3ddc9b; }
:root[data-theme="dark"][data-accent="violet"] { --accent: #a99aff; }
:root[data-theme="dark"][data-accent="graphite"] { --accent: #cdd5e2; }
:root[data-theme="dark"][data-accent="emerald"], :root[data-theme="dark"][data-accent="graphite"] { --accent-ink: #07130e; }

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
#app { height: 100%; }
body { font: 13.5px/1.5 var(--sans); background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; font-feature-settings: "tnum" 1, "cv11" 1; letter-spacing: -.003em; }
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -.012em; }
h3 { font-size: 14px; }
.mono { font-family: var(--mono); font-size: 12px; letter-spacing: 0; }
.muted { color: var(--ink-2); }
.small { font-size: 12px; }
.hide { display: none !important; }
.ico { display: inline-flex; width: 16px; height: 16px; flex: none; }
.ico svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.mark { display: flex; align-items: center; gap: 10px; font-weight: 600; }
.mark .logo { width: 28px; height: 28px; border-radius: 7px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 700; font-size: 14px; letter-spacing: -.02em; flex: none; }
.mark small { display: block; font-weight: 500; font-size: 11px; opacity: .65; line-height: 1.1; margin-top: 1px; }

/* buttons and fields */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--line-2); background: var(--surface); font-weight: 550; line-height: 1; box-shadow: var(--shadow); transition: background .12s, border-color .12s; white-space: nowrap; }
.btn:hover { background: var(--surface-2); border-color: color-mix(in srgb, var(--ink) 28%, var(--line-2)); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { background: color-mix(in srgb, var(--accent) 88%, #000); }
.btn.danger { color: var(--bad); }
.btn.ghost { border-color: transparent; background: transparent; box-shadow: none; color: var(--ink-2); }
.btn.ghost:hover { background: var(--sunken); color: var(--ink); }
.btn.sm { height: 26px; padding: 0 9px; font-size: 12px; border-radius: 5px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.icon-btn { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 6px; border: 1px solid transparent; background: transparent; color: var(--ink-2); }
.icon-btn:hover { background: var(--sunken); color: var(--ink); }
label.fl { display: block; font-size: 12px; font-weight: 550; color: var(--ink-2); margin: 0 0 5px; }
label.fl .req { color: var(--bad); margin-left: 2px; }
.inp, select.inp, textarea.inp { width: 100%; height: 34px; padding: 0 10px; border: 1px solid var(--line-2); border-radius: 6px; background: var(--surface); transition: border-color .12s, box-shadow .12s; }
.inp::placeholder { color: var(--ink-3); }
.inp:focus { border-color: var(--accent); box-shadow: var(--ring); outline: none; }
textarea.inp { height: auto; padding: 8px 10px; font-family: var(--mono); font-size: 12px; resize: vertical; min-height: 76px; line-height: 1.5; }
input[type=range] { accent-color: var(--accent); }
input[type=checkbox] { accent-color: var(--accent); }
.hint { font-size: 12px; color: var(--ink-3); margin-top: 4px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }

/* tags, methods, status */
.pill { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 7px; border-radius: 4px; font-size: 11px; font-weight: 600; letter-spacing: .01em; background: var(--sunken); color: var(--ink-2); white-space: nowrap; }
.pill.good { background: color-mix(in srgb, var(--good) 13%, transparent); color: var(--good); }
.pill.bad { background: color-mix(in srgb, var(--bad) 13%, transparent); color: var(--bad); }
.pill.warn { background: color-mix(in srgb, var(--warn) 15%, transparent); color: var(--warn); }
.pill.info { background: color-mix(in srgb, var(--info) 13%, transparent); color: var(--info); }
.verb { display: inline-block; min-width: 44px; text-align: center; font-family: var(--mono); font-size: 10.5px; font-weight: 700; padding: 2px 0; border-radius: 4px; letter-spacing: .04em; border: 1px solid currentColor; background: transparent; }
.verb.GET { color: var(--info); }
.verb.POST { color: var(--good); }
.verb.PUT, .verb.PATCH { color: var(--warn); }
.verb.DELETE { color: var(--bad); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); flex: none; }
.dot.good { background: var(--good); } .dot.bad { background: var(--bad); } .dot.warn { background: var(--warn); }

/* sign in */
.login { min-height: 100%; display: grid; grid-template-columns: minmax(340px, 5fr) 6fr; }
.login .brand { background: var(--side); color: var(--side-ink); padding: 40px clamp(28px, 5vw, 64px); display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden;
  background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px); background-size: 32px 32px; background-position: -1px -1px; }
.login .brand::after { content: ""; position: absolute; inset: auto 0 0 0; height: 55%; background: linear-gradient(to top, var(--side), transparent); pointer-events: none; }
.login .brand > * { position: relative; z-index: 1; }
.login h1 { font-size: 30px; line-height: 1.15; color: #fff; }
.login .lede { color: var(--side-ink-2); margin: 10px 0 0; max-width: 40ch; font-size: 14px; }
.login .conn { margin-top: 30px; display: grid; gap: 1px; border: 1px solid rgba(255,255,255,.1); border-radius: 8px; overflow: hidden; background: rgba(255,255,255,.08); max-width: 420px; }
.login .conn .c { display: grid; grid-template-columns: 14px 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; background: rgba(12, 22, 44, .92); font-size: 12.5px; }
.login .conn .c b { font-weight: 550; color: #fff; }
.login .conn .c span.v { color: var(--side-ink-2); font-family: var(--mono); font-size: 11.5px; }
.login .panel { display: grid; place-items: center; padding: 32px 20px; position: relative; }
.login .panel .corner { position: absolute; right: 16px; top: 16px; }
.login form { width: min(380px, 100%); }
.login form h2 { font-size: 22px; margin-bottom: 4px; }
.login .field { margin-top: 14px; }
.login .err { margin-top: 14px; padding: 10px 12px; border-radius: 6px; background: color-mix(in srgb, var(--bad) 11%, transparent); color: var(--bad); font-size: 12.5px; white-space: pre-wrap; border: 1px solid color-mix(in srgb, var(--bad) 30%, transparent); }
.login details { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 12px; }
.login details summary { cursor: pointer; font-weight: 550; color: var(--ink-2); }
.pwbox { position: relative; }
.pwbox .icon-btn { position: absolute; right: 1px; top: 1px; width: 32px; height: 32px; }
.recent { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.recent button { font-size: 12px; padding: 2px 8px; border-radius: 4px; border: 1px solid var(--line-2); background: var(--surface-2); color: var(--ink-2); }
.recent button:hover { color: var(--ink); border-color: var(--ink-3); }

/* shell */
.shell { height: 100%; display: grid; grid-template-columns: 232px minmax(0, 1fr); grid-template-rows: 100%; }
.side { background: var(--side); color: var(--side-ink); display: flex; flex-direction: column; min-height: 0; }
.side .mark { padding: 16px 16px 14px; color: #fff; }
.side nav { overflow-y: auto; padding: 2px 8px 12px; flex: 1; }
.side .grp { font-size: 10.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--side-ink-2); padding: 16px 10px 6px; font-weight: 600; }
.side a.nav { position: relative; display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 10px; border-radius: 6px; color: var(--side-ink); text-decoration: none; cursor: pointer; font-weight: 500; }
.side a.nav .ico { opacity: .75; }
.side a.nav:hover { background: var(--side-2); }
.side a.nav.on { background: color-mix(in srgb, var(--accent) 26%, transparent); color: #fff; }
.side a.nav.on .ico { opacity: 1; }
.side a.nav.on::before { content: ""; position: absolute; left: -8px; top: 6px; bottom: 6px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); }
:root[data-theme="dark"][data-accent="graphite"] .side a.nav.on { background: rgba(255,255,255,.1); }
.side .foot { padding: 10px 12px 12px; border-top: 1px solid rgba(255,255,255,.07); display: flex; gap: 6px; flex-wrap: wrap; }
.side .foot .btn { background: transparent; color: var(--side-ink); border-color: rgba(255,255,255,.14); box-shadow: none; }
.side .foot .btn:hover { background: var(--side-2); }
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.top { display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 20px; border-bottom: 1px solid var(--line); background: var(--surface); flex: none; }
.top h1 { font-size: 15px; }
.env { display: inline-flex; align-items: center; gap: 7px; height: 24px; padding: 0 9px; border: 1px solid var(--line); border-radius: 5px; color: var(--ink-2); font-family: var(--mono); font-size: 11.5px; background: var(--surface-2); }
.chip { display: inline-flex; align-items: baseline; gap: 8px; padding: 0 4px; color: var(--ink-2); font-size: 12px; }
.chip .amt { font-size: 15px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.who { position: relative; }
.who > button { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 8px 0 4px; border-radius: 6px; border: 1px solid var(--line-2); background: var(--surface); }
.who > button:hover { background: var(--surface-2); }
.avatar { width: 24px; height: 24px; border-radius: 6px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 700; font-size: 11.5px; flex: none; }
.menu { position: absolute; right: 0; top: calc(100% + 6px); width: 320px; background: var(--surface); border: 1px solid var(--line-2); border-radius: 8px; box-shadow: var(--pop); padding: 4px; z-index: 40; }
.menu .it { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 6px; cursor: pointer; }
.menu .it:hover { background: var(--sunken); }
.menu .it.on { background: color-mix(in srgb, var(--accent) 10%, transparent); }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
.content { flex: 1; overflow-y: auto; padding: 24px; }
.content > .page { max-width: 1120px; margin: 0 auto; }
.page > .lead { color: var(--ink-2); margin: 0 0 18px; max-width: 74ch; }
.page h2.sec { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); margin: 28px 0 10px; font-weight: 600; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 14px; align-items: start; }
.stack { display: grid; gap: 12px; }
.tabs { display: flex; gap: 20px; flex-wrap: wrap; margin: 0 0 16px; border-bottom: 1px solid var(--line); max-width: 100%; }
.tabs button { padding: 8px 0 9px; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; background: transparent; font-weight: 550; color: var(--ink-2); }
.tabs button:hover { color: var(--ink); }
.tabs button.on { color: var(--ink); border-bottom-color: var(--accent); }
.notice { padding: 9px 12px; border-radius: 6px; background: color-mix(in srgb, var(--info) 10%, transparent); color: var(--info); font-size: 12.5px; margin-bottom: 14px; border: 1px solid color-mix(in srgb, var(--info) 22%, transparent); }
.notice.warn { background: color-mix(in srgb, var(--warn) 11%, transparent); color: var(--warn); border-color: color-mix(in srgb, var(--warn) 26%, transparent); }
.notice.bad { background: color-mix(in srgb, var(--bad) 10%, transparent); color: var(--bad); border-color: color-mix(in srgb, var(--bad) 26%, transparent); }

/* panels */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); }
.card.pad { padding: 16px; }
details.act > summary { list-style: none; display: flex; align-items: center; gap: 10px; padding: 10px 14px; cursor: pointer; border-radius: 8px; min-height: 44px; }
details.act > summary:hover { background: var(--surface-2); }
details.act > summary::-webkit-details-marker { display: none; }
details.act[open] > summary { border-bottom: 1px solid var(--line); border-bottom-left-radius: 0; border-bottom-right-radius: 0; background: var(--surface-2); }
details.act > summary .t { font-weight: 600; }
details.act > summary .p { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
details.act > summary .pill { margin-left: auto; }
details.act > summary .chev { color: var(--ink-3); transition: transform .12s; }
details.act[open] > summary .chev { transform: rotate(90deg); }
.act .body { padding: 14px; display: grid; gap: 12px; }
.act .note { color: var(--ink-2); font-size: 12.5px; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.fields .wide { grid-column: 1 / -1; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.result { border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--surface); }
.result .rh { display: flex; gap: 10px; align-items: center; padding: 6px 10px; background: var(--surface-2); border-bottom: 1px solid var(--line); flex-wrap: wrap; min-height: 34px; }
.result .rh .msg { font-weight: 550; min-width: 0; overflow-wrap: anywhere; }
.result .rb { padding: 12px; max-height: 420px; overflow: auto; }
.result .rtabs { margin-left: auto; display: flex; gap: 2px; }
.result .rtabs button { height: 22px; padding: 0 8px; border: 0; border-radius: 4px; background: transparent; font-size: 12px; color: var(--ink-2); }
.result .rtabs button.on { background: var(--sunken); color: var(--ink); }
pre.json { margin: 0; padding: 10px 12px; border-radius: 6px; background: var(--code-bg); color: var(--code-ink); font: 12px/1.55 var(--mono); overflow: auto; white-space: pre-wrap; word-break: break-word; }
pre.json .k { color: #8fb6ff; } pre.json .s { color: #a8dd9a; } pre.json .n { color: #f1c27d; } pre.json .b { color: #d9a6e8; } pre.json .z { color: #7d8aa3; }
.kv { display: grid; grid-template-columns: minmax(130px, max-content) 1fr; gap: 7px 20px; }
.kv .k { color: var(--ink-2); font-size: 12.5px; }
.kv .v { overflow-wrap: anywhere; font-weight: 500; font-variant-numeric: tabular-nums; }
table.t { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.t th { text-align: left; font-size: 11.5px; font-weight: 600; color: var(--ink-2); padding: 8px 10px; border-bottom: 1px solid var(--line-2); position: sticky; top: 0; background: var(--surface-2); white-space: nowrap; }
table.t td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; max-width: 260px; overflow-wrap: anywhere; }
table.t tr.clk { cursor: pointer; }
table.t tr.clk:hover td { background: var(--surface-2); }
table.t td.num, table.t th.num { text-align: right; font-variant-numeric: tabular-nums; }
.tw { overflow: auto; border: 1px solid var(--line); border-radius: 6px; max-height: 460px; }
.tw table.t tr:last-child td { border-bottom: 0; }

/* wallet overview */
.balance { display: grid; grid-template-columns: 1.5fr 1fr 1fr 1fr; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); overflow: hidden; }
.balance .cell { padding: 16px 18px; border-left: 1px solid var(--line); min-width: 0; }
.balance .cell:first-child { border-left: 0; background: var(--side); color: var(--side-ink); }
.balance .lab { font-size: 11.5px; font-weight: 600; color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; }
.balance .cell:first-child .lab { color: var(--side-ink-2); }
.balance .num { font-size: 30px; font-weight: 600; letter-spacing: -.025em; margin: 6px 0 8px; font-variant-numeric: tabular-nums; line-height: 1.1; }
.balance .val { font-size: 15px; font-weight: 600; margin-top: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.balance .sub { color: var(--side-ink-2); font-size: 12px; }
.balance .btn { background: rgba(255,255,255,.1); color: var(--side-ink); border-color: rgba(255,255,255,.2); box-shadow: none; }
.balance .btn:hover { background: rgba(255,255,255,.18); }

/* escrow */
.esc { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.esc > * { min-width: 0; }
.steps { display: grid; gap: 0; }
.stepbtn { position: relative; display: grid; grid-template-columns: 24px 1fr auto; gap: 12px; align-items: center; padding: 10px 10px; border: 1px solid transparent; border-radius: 6px; background: transparent; text-align: left; width: 100%; }
.stepbtn:hover { background: var(--surface-2); border-color: var(--line); }
.stepbtn:not(:last-child)::after { content: ""; position: absolute; left: 21px; top: 38px; bottom: -10px; width: 1px; background: var(--line-2); }
.stepbtn .n { width: 24px; height: 24px; border-radius: 50%; background: var(--surface); color: var(--accent); border: 1.5px solid var(--accent); display: grid; place-items: center; font-weight: 700; font-size: 11.5px; position: relative; z-index: 1; }
.stepbtn b { display: block; font-weight: 600; }
.stepbtn span.d { color: var(--ink-2); font-size: 12.5px; }
.stepbtn .ico { color: var(--ink-3); }
.bar { height: 6px; border-radius: 999px; background: var(--sunken); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); transition: width .3s; }
.mathtbl { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 13px; margin-top: 4px; }
.mathtbl td { padding: 6px 0; border-bottom: 1px solid var(--line); color: var(--ink-2); }
.mathtbl td:last-child { text-align: right; font-weight: 600; color: var(--ink); font-family: var(--mono); font-size: 12.5px; }
.mathtbl tr.sum td { border-bottom: 0; border-top: 1px solid var(--ink-3); color: var(--ink); font-weight: 650; padding-top: 8px; }
.tl { display: grid; gap: 0; max-height: 360px; overflow: auto; border: 1px solid var(--line); border-radius: 6px; }
.tl .ev { display: grid; grid-template-columns: 38px 1fr; gap: 10px; padding: 8px 10px; border-bottom: 1px solid var(--line); font-size: 12.5px; align-items: start; }
.tl .ev:last-child { border-bottom: 0; }
.tl .ev .m { color: var(--ink-2); font-size: 12px; overflow-wrap: anywhere; }
.tl .ev .pill { justify-content: center; }
.tl .empty { border: 0; }
.delta.up { color: var(--good); } .delta.down { color: var(--bad); }
.bal { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); }
.bal:last-child { border-bottom: 0; }
.bal .fig { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }

function resolvedTheme() { return S.theme === 'system' ? (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : S.theme; }
function applyTheme(t) { S.theme = t; document.documentElement.setAttribute('data-theme', resolvedTheme()); LS.set('wc-theme', t); }
function applyAccent(a) { S.accent = a; document.documentElement.setAttribute('data-accent', a); LS.set('wc-accent', a); }

  const b = h('button', { class: 'icon-btn', type: 'button', title: 'Switch light and dark', 'aria-label': 'Switch light and dark theme', onclick: () => {

function loginForm(onDone) {

  const pass = h('input', { class: 'inp', type: 'password', autocomplete: 'current-password', placeholder: 'Password', required: true });

  const recent = h('div', { class: 'recent' }, S.recent.map(r => h('button', { type: 'button', onclick: () => { email.value = r; pass.focus(); } }, r)));
  const dl = h('datalist', { id: 'recent-emails' }, S.recent.map(r => h('option', { value: r })));

const openLogs = new Set();
let errorsOnly = false;
function toggleLog() { S.logOpen = !S.logOpen; R.drawer.classList.toggle('open', S.logOpen); if (S.logOpen) renderLog(); }
function buildDrawer() {
  R.logList = h('div', { class: 'dl' });
  R.drawer.replaceChildren(
    h('div', { class: 'dh' }, h('b', null, 'Request log'), h('span', { class: 'muted small' }, 'Every call this page makes'), h('span', { class: 'spacer' }),
      h('label', { class: 'small', style: { display: 'flex', gap: '6px', alignItems: 'center' } }, h('input', { type: 'checkbox', onchange: e => { errorsOnly = e.target.checked; renderLog(); } }), 'Errors only'),
      h('button', { class: 'btn sm', type: 'button', onclick: () => { S.log.length = 0; renderLog(); } }, 'Clear'),
      h('button', { class: 'icon-btn', type: 'button', 'aria-label': 'Close log', onclick: toggleLog }, ico('x'))),
    R.logList);

}
function renderLog() {
  if (!R.logList || !S.logOpen) return;
  const rows = S.log.filter(e => !errorsOnly || e.net || e.status >= 400).slice(0, 120);
  if (!rows.length) { R.logList.replaceChildren(h('div', { class: 'empty', style: { margin: '14px' } }, 'Nothing yet.')); return; }
  R.logList.replaceChildren(...rows.map(e => {
    const tone = e.net ? 'bad' : e.status < 300 ? 'good' : e.status < 500 ? 'warn' : 'bad';
    const wrap = h('div', { class: 'lg' });
    const head = h('div', { class: 'l1', onclick: () => { if (openLogs.has(e.id)) openLogs.delete(e.id); else openLogs.add(e.id); renderLog(); } },
      h('span', { class: 'muted mono' }, e.at.toTimeString().slice(0, 8)),
      h('span', { class: 'verb ' + e.method }, e.method),
      h('span', { class: 'u' }, e.url),
      h('span', { class: 'pill ' + tone }, e.net ? 'ERR' : e.status),
      h('span', { class: 'muted small' }, e.ms + ' ms'));
    wrap.append(head);
    if (openLogs.has(e.id)) {
      const res = { entry: e, data: e.resData, text: e.resText, ok: !e.net && e.status < 400, status: e.status, ms: e.ms, net: !!e.net, payload: e.resData, message: (e.resData && e.resData.message) || '', error: e.error };
      wrap.append(h('div', { class: 'det' }, requestView(e), e.net ? h('div', { class: 'notice bad' }, explainFail(res)) : jsonView(e.resData !== null ? e.resData : (e.resText || '(empty body)'))));
    }
    return wrap;
  }));
}

// Escrow simulator

function rid() { return Math.random().toString(16).slice(2, 8); }
function toCents(s) {
  const m = String(s === undefined || s === null ? '' : s).trim().match(/^(\d+)(?:\.(\d{1,2}))?\d*$/);
  if (!m) return null;
  return BigInt(m[1]) * 100n + BigInt((m[2] || '').padEnd(2, '0') || '0');
}
function centsStr(c) { c = BigInt(c); const neg = c < 0n; if (neg) c = -c; return (neg ? '-' : '') + (c / 100n).toString() + '.' + (c % 100n).toString().padStart(2, '0'); }
function feeCents(c, rate) {
  let str = String(rate); if (/e/i.test(str)) str = Number(rate).toFixed(10);
  const [i, f = ''] = str.split('.'); const n = BigInt(i + f), d = 10n ** BigInt(f.length);
  return (2n * c * n + d) / (2n * d);
}
const E = { id: rid(), hold: null, events: [], rate: null, rateKnown: false, base: {}, cur: {}, last: null, busy: false };

PAGES.escrow = () => {
  const sess = session() || {};
  const others = Object.values(S.sessions).filter(s => s.email !== S.active);
  const tenant = h('input', { class: 'inp mono', spellcheck: 'false' }); tenant.value = E.tenant || sess.userId || '';
  const owner = h('input', { class: 'inp', spellcheck: 'false', list: 'owner-list' }); owner.value = E.owner || (others[0] ? others[0].email : S.vars.recipient_email);
  const ownerList = h('datalist', { id: 'owner-list' }, Object.values(S.sessions).map(s => h('option', { value: s.email })).concat([h('option', { value: S.vars.recipient_email })]));
  const price = h('input', { class: 'inp', inputmode: 'decimal' }); price.value = E.price || '100.00';
  const bid = h('input', { class: 'inp mono' }); bid.value = E.id;
  const init = h('input', { class: 'inp' }); init.value = S.cfg.initiatedBy;
  const pct = h('input', { type: 'range', min: 0, max: 100, step: 5, value: E.pct === undefined ? 50 : E.pct, style: { width: '100%' } });
  const pctLab = h('b');
  const math = h('table', { class: 'mathtbl' });
  const holdBox = h('div'); const balBox = h('div'); const evBox = h('div', { class: 'tl' });
  const refsLine = h('div', { class: 'hint mono' });

  const cfg = () => {
    E.tenant = tenant.value.trim(); E.owner = owner.value.trim(); E.price = price.value.trim(); E.id = bid.value.trim() || rid(); E.pct = Number(pct.value);
    const c = { tenant: E.tenant, owner: E.owner, id: E.id, init: init.value.trim(), pct: E.pct, priceC: toCents(E.price) };
    c.refs = { hold: 'booking-' + c.id, release: 'booking-release-' + c.id, refund: 'booking-refund-' + c.id, payout: 'booking-payout-' + c.id };
    return c;
  };
  const drawMath = () => {
    const c = cfg(); pctLab.textContent = c.pct + '%';
    refsLine.textContent = 'References: ' + Object.values(c.refs).join('   ');
    const rate = E.rate === null ? 0.01 : E.rate;
    if (c.priceC === null || c.priceC <= 0n) { math.replaceChildren(h('tr', null, h('td', null, 'Enter a positive price with at most 2 decimals'))); return; }
    const fee = feeCents(c.priceC, rate), total = c.priceC + fee;
    const refund = (c.priceC * BigInt(c.pct) + 50n) / 100n, ownerShare = c.priceC - refund;
    const row = (a, b, cls) => h('tr', { class: cls || '' }, h('td', null, a), h('td', null, b));
    math.replaceChildren(
      row('Booking price held in escrow', centsStr(c.priceC)),
      row('Commission at ' + (rate * 100).toFixed(2).replace(/\.?0+$/, '') + '%' + (E.rateKnown ? '' : ' (assumed)') + ', charged once', centsStr(fee)),
      row('Tenant is debited', centsStr(total), 'sum'),
      row('Owner receives on release', centsStr(c.priceC)),
      row('On cancel at ' + c.pct + '%: tenant refund / owner share', centsStr(refund) + ' / ' + centsStr(ownerShare)));
  };

  // ----- display -----
  const drawHold = () => {
    const c = cfg(); const hd = E.hold;
    if (!hd) { holdBox.replaceChildren(h('div', { class: 'empty' }, 'No hold found for ' + c.refs.hold + ' yet.')); return; }
    const amount = Number(hd.amount), rem = Number(hd.remainingAmount);

    fill(holdBox,
      h('div', { class: 'row' }, h('h3', null, 'Escrow hold'), h('span', { class: 'pill ' + statusTone(hd.status) }, hd.status), h('span', { class: 'spacer' }), h('span', { class: 'mono muted' }, hd.reference)),
      h('div', { style: { height: '10px' } }),
      h('div', { class: 'bar', title: 'Still held' }, h('i', { style: { width: pctLeft + '%' } })),
      h('div', { class: 'hint', style: { marginBottom: '10px' } }, 'Still held: ' + fmtMoney(hd.remainingAmount, hd.currency) + ' of ' + fmtMoney(hd.amount, hd.currency)),
      kvView({ senderEmail: hd.senderEmail, beneficiaryEmail: hd.beneficiaryEmail, amount: hd.amount, commission: hd.commission, totalDebited: hd.totalDebited, remainingAmount: hd.remainingAmount, failureReason: hd.failureReason }),
      Array.isArray(hd.payouts) && hd.payouts.length ? h('div', null, h('div', { class: 'fl', style: { marginTop: '12px' } }, 'Payouts'), tableView(hd.payouts)) : null);
  };
  const drawBalances = () => {
    const keys = Object.keys(S.sessions);
    fill(balBox, h('div', { class: 'row' }, h('h3', null, 'Wallets signed in here'), h('span', { class: 'spacer' }),
      h('button', { class: 'btn sm', type: 'button', onclick: () => { E.base = Object.assign({}, E.cur); drawBalances(); } }, 'Reset baseline'),
      h('button', { class: 'btn sm', type: 'button', onclick: () => refreshBalances() }, ico('refresh'), 'Refresh')),
      ...keys.map(k => {
        const s = S.sessions[k], cur = E.cur[k], base = E.base[k];

        return h('div', { class: 'bal' }, h('span', { class: 'avatar' }, (s.email || '?')[0].toUpperCase()),
          h('div', { style: { minWidth: 0 } }, h('div', { style: { fontWeight: 600, overflow: 'hidden', textOverflow: 'ellipsis' } }, s.email), h('div', { class: 'hint' }, s.role || 'role unknown')),

      }),
      Object.keys(S.sessions).length < 2 ? h('div', { class: 'hint' }, 'Add the owner as a second account from the top bar to see both balances move.') : null);
  };
  const drawEvents = () => {
    if (!E.events.length) { evBox.replaceChildren(h('div', { class: 'empty' }, 'Run a step to see what the wallet service answers.')); return; }
    evBox.replaceChildren(...E.events.slice(0, 40).map(ev => {

    }));
  };

  // ----- calls -----
  const keyOk = () => { if (!S.cfg.apiKey) { toast('Set the internal API key in Connection first', true); openSettings(); return false; } return true; };
  const esc1 = async (label, method, path, body) => {
    const res = await call({ svc: 'wallet', method, path, body, auth: 'key' });
    E.events.unshift({ label, res }); drawEvents(); return res;
  };
  const refreshHold = async () => {
    const c = cfg();
    const res = await call({ svc: 'wallet', method: 'GET', path: '/internal/escrow/' + encodeURIComponent(c.refs.hold), auth: 'key' });
    if (res.ok) E.hold = res.payload; else if (res.status === 404) E.hold = null;

    for (const [k, s] of Object.entries(S.sessions)) { const b = await fetchBalanceFor(s); if (b) { E.cur[k] = b.value; if (E.base[k] === undefined) E.base[k] = b.value; } }
    drawBalances(); refreshBalance();

  const loadRate = async () => {
    if (!S.cfg.apiKey) return;
    const r = await call({ svc: 'wallet', method: 'GET', path: '/internal/commission/rates', auth: 'key' });

  };
  const after = async () => { await refreshHold(); await refreshBalances(); };
  const holdBody = (c, o) => Object.assign({ senderUserId: c.tenant, beneficiaryEmail: c.owner, amount: Number(centsStr(c.priceC)), description: 'Booking ' + c.id, reference: c.refs.hold, initiatedBy: c.init }, o || {});
  const payBody = (c, recipient, cents, reference) => ({ recipientAccountNumber: recipient, amount: Number(centsStr(cents)), description: 'Payout for booking ' + c.id, reference, initiatedBy: c.init });
  const remainingCents = c => { const r = E.hold ? toCents(String(E.hold.remainingAmount)) : null; return r === null ? c.priceC : r; };
  const priceOk = c => { if (c.priceC === null || c.priceC <= 0n) { toast('Enter a positive price with at most 2 decimals', true); return false; } return true; };

  const steps = {
    async hold() {
      const c = cfg(); if (!keyOk() || !priceOk(c)) return;
      const body = holdBody(c); E.last = { method: 'POST', path: '/internal/escrow/hold', body, label: 'Hold' };
      await esc1('Hold ' + centsStr(c.priceC) + ' for ' + c.refs.hold, 'POST', '/internal/escrow/hold', body); await after();
    },
    async release() {
      const c = cfg(); if (!keyOk() || !priceOk(c)) return; await refreshHold();
      const rem = remainingCents(c), to = E.hold ? E.hold.beneficiaryEmail : c.owner;
      const body = payBody(c, to, rem, c.refs.release); E.last = { method: 'POST', path: '/internal/escrow/' + c.refs.hold + '/payouts', body, label: 'Release' };
      await esc1('Release ' + centsStr(rem) + ' to the owner', 'POST', E.last.path, body); await after();
    },
    async cancel() {
      const c = cfg(); if (!keyOk() || !priceOk(c)) return; await refreshHold();
      if (!E.hold) { toast('Hold first: there is no hold for ' + c.refs.hold, true); return; }
      const rem = remainingCents(c), refund = (rem * BigInt(c.pct) + 50n) / 100n, share = rem - refund;
      if (refund > 0n) { const b = payBody(c, E.hold.senderEmail, refund, c.refs.refund); E.last = { method: 'POST', path: '/internal/escrow/' + c.refs.hold + '/payouts', body: b, label: 'Refund' }; await esc1('Refund ' + centsStr(refund) + ' to the tenant', 'POST', E.last.path, b); }
      if (share > 0n) { const b = payBody(c, E.hold.beneficiaryEmail, share, c.refs.payout); E.last = { method: 'POST', path: '/internal/escrow/' + c.refs.hold + '/payouts', body: b, label: 'Owner share' }; await esc1('Pay ' + centsStr(share) + ' to the owner', 'POST', E.last.path, b); }
      await after();
    },
    async lookup() { if (!keyOk()) return; const c = cfg(); await esc1('Look up ' + c.refs.hold, 'GET', '/internal/escrow/' + encodeURIComponent(c.refs.hold)); await after(); },
    async repeat() {
      if (!keyOk()) return; if (!E.last) { toast('Run a step first, then repeat it', true); return; }
      await esc1('Repeat the last request (' + E.last.label + ', expect 409)', E.last.method, E.last.path, E.last.body); await after();
    },
    async holdTwice() {
      const c0 = cfg(); if (!keyOk() || !priceOk(c0)) return;
      E.id = rid(); bid.value = E.id; E.hold = null; const c = cfg(); drawMath(); drawHold();
      const body = holdBody(c);
      const [a, b] = await Promise.all([1, 2].map(() => call({ svc: 'wallet', method: 'POST', path: '/internal/escrow/hold', body, auth: 'key' })));
      E.events.unshift({ label: 'Same hold sent twice at once, request B', res: b }, { label: 'Same hold sent twice at once, request A (expect one 200 and one 409)', res: a }); drawEvents(); await after();
    },
    async racePayouts() {
      const c = cfg(); if (!keyOk() || !priceOk(c)) return; await refreshHold();
      if (!E.hold) { toast('Hold first', true); return; }
      const rem = remainingCents(c), each = rem * 6n / 10n; if (each <= 0n) { toast('Nothing left to race for', true); return; }
      const path = '/internal/escrow/' + c.refs.hold + '/payouts';
      const mk = (suffix) => call({ svc: 'wallet', method: 'POST', path, body: payBody(c, E.hold.beneficiaryEmail, each, 'booking-race-' + suffix + '-' + c.id + '-' + rid()), auth: 'key' });
      const [a, b] = await Promise.all([mk('a'), mk('b')]);
      E.events.unshift({ label: 'Race payout B (' + centsStr(each) + ')', res: b }, { label: 'Race payout A (' + centsStr(each) + ', two of 60% against 100%: expect one 200 and one 422)', res: a }); drawEvents(); await after();
    },
    async overspend() {
      const c = cfg(); if (!keyOk() || !priceOk(c)) return; await refreshHold();
      if (!E.hold) { toast('Hold first', true); return; }
      const over = remainingCents(c) + 1n;
      await esc1('Overspend: pay ' + centsStr(over) + ' (one cent more than is left, expect 422)', 'POST', '/internal/escrow/' + c.refs.hold + '/payouts', payBody(c, E.hold.beneficiaryEmail, over, 'booking-over-' + rid())); await after();
    },
    async stranger() {
      const c = cfg(); if (!keyOk() || !priceOk(c)) return;
      await esc1('Payout to a stranger (expect 400)', 'POST', '/internal/escrow/' + c.refs.hold + '/payouts', payBody(c, 'stranger@example.com', 1n, 'booking-stranger-' + rid())); await after();
    },
    async badCaller() {
      const c = cfg(); if (!keyOk() || !priceOk(c)) return;
      await esc1('Hold from an unknown caller (expect 403)', 'POST', '/internal/escrow/hold', holdBody(c, { initiatedBy: 'SOME_OTHER_SERVICE', reference: 'booking-badcaller-' + rid() }));
    },
    async missing() { if (!keyOk()) return; await esc1('Look up a hold that does not exist (expect 404)', 'GET', '/internal/escrow/booking-does-not-exist-' + rid()); }
  };
  const stepEls = [];
  const wrap = fn => async () => {
    if (E.busy) return; E.busy = true; stepEls.forEach(b => b.disabled = true);
    try { await fn(); } finally { E.busy = false; stepEls.forEach(b => b.disabled = false); }
  };
  const stepBtn = (n, title, desc, fn) => { const b = h('button', { class: 'stepbtn', type: 'button', onclick: wrap(fn) }, h('span', { class: 'n' }, n), h('div', null, h('b', null, title), h('span', { class: 'd' }, desc)), ico('chev')); stepEls.push(b); return b; };
  const edgeBtn = (title, fn) => { const b = h('button', { class: 'btn sm', type: 'button', onclick: wrap(fn) }, title); stepEls.push(b); return b; };

  for (const el of [tenant, owner, price, bid, init, pct]) el.addEventListener('input', () => { drawMath(); if (el === bid) { E.hold = null; drawHold(); } });
  const newBooking = h('button', { class: 'btn sm', type: 'button', onclick: () => { bid.value = rid(); E.hold = null; E.last = null; drawMath(); drawHold(); } }, 'New booking id');

  const left = h('div', { class: 'stack' },
    h('div', { class: 'card pad stack' },
      h('h3', null, 'Booking'),
      h('div', { class: 'fields' },
        h('div', { class: 'wide' }, h('label', { class: 'fl' }, 'Tenant user id (the payer)'), tenant, h('div', { class: 'hint' }, 'Filled from the active account. Switch to the tenant before opening this page, or paste an id.')),
        h('div', null, h('label', { class: 'fl' }, 'Owner email (the beneficiary)'), owner, ownerList),
        h('div', null, h('label', { class: 'fl' }, 'Booking price'), price),
        h('div', null, h('label', { class: 'fl' }, 'Booking id'), bid),
        h('div', null, h('label', { class: 'fl' }, 'initiatedBy'), init),
        h('div', { class: 'wide' }, h('label', { class: 'fl' }, 'Refund share on cancellation: ', pctLab), pct)),
      h('div', { class: 'row' }, newBooking, h('button', { class: 'btn sm', type: 'button', onclick: loadRate }, 'Reload commission rate')),
      refsLine, math),
    h('div', { class: 'card pad stack' },
      h('h3', null, 'Walk through a booking'),
      !S.cfg.apiKey ? keyBanner() : null,
      h('div', { class: 'steps' },
        stepBtn('1', 'Hold the payment', 'Tenant pays price plus commission once. The price is held in escrow.', steps.hold),
        stepBtn('2', 'Release to the owner', 'After check-in: whatever is left goes to the owner, with no commission.', steps.release),
        stepBtn('3', 'Or cancel with a refund', 'Refund the tenant their share and pay the owner the rest, two payouts.', steps.cancel),
        stepBtn('4', 'Look it up', 'Read the hold and its payouts back from the wallet service.', steps.lookup))),
    h('div', { class: 'card pad stack' },
      h('h3', null, 'Edge cases from the spec'),
      h('div', { class: 'row' },
        edgeBtn('Repeat last request', steps.repeat), edgeBtn('Hold twice at once (new id)', steps.holdTwice), edgeBtn('Race two payouts', steps.racePayouts),
        edgeBtn('Overspend by 1 cent', steps.overspend), edgeBtn('Pay a stranger', steps.stranger), edgeBtn('Unknown caller', steps.badCaller), edgeBtn('Missing hold', steps.missing)),
      h('div', { class: 'hint' }, 'Each button states what the wallet service should answer. Anything else is worth a look in the request log.')));
  const right = h('div', { class: 'stack' },
    h('div', { class: 'card pad' }, holdBox),
    h('div', { class: 'card pad' }, balBox),
    h('div', { class: 'card pad stack' }, h('div', { class: 'row' }, h('h3', null, 'Activity'), h('span', { class: 'spacer' }), h('button', { class: 'btn sm', type: 'button', onclick: () => { E.events = []; drawEvents(); } }, 'Clear')), evBox));
  drawMath(); drawHold(); drawBalances(); drawEvents();
  setTimeout(() => { loadRate(); refreshHold(); refreshBalances(); }, 0);
  return h('div', null,
    lead('Play the listing service: hold a booking payment, release it or refund it, and check that the commission is charged once and the money adds up. Needs the internal API key, and each account you want to watch signed in from the top bar.'),
    h('div', { class: 'esc' }, left, right));
};

// ---------- start ----------
window.addEventListener('error', e => { try { toast('Script error: ' + e.message, true); } catch (x) { /* ignore */ } });
window.addEventListener('unhandledrejection', e => { try { toast('Unexpected error: ' + (e.reason && e.reason.message || e.reason), true); } catch (x) { /* ignore */ } });
applyTheme(S.theme);
applyAccent(S.accent);
if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (S.theme === 'system') applyTheme('system'); });
renderApp();

</script>
</body>
</html>
