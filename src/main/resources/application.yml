spring:
  application:
    name: premisave-wallet-service

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/premisave-wallet}
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  cloud:
    discovery:
      enabled: false

server:
  port: 8084

# Auth Service Integration
auth:
  service:
    url: ${AUTH_SERVICE_URL:http://localhost:8080}
    # Must match the API_KEY set in the auth service .env
    api-key: ${AUTH_SERVICE_API_KEY:replace-this-in-production}

# Shared secret internal services present via X-API-Key when calling
# wallet-service's /internal/** endpoints (see InternalApiKeyFilter).
# Must match property-service's app.api-key (INTERNAL_API_KEY env var) —
# both services read the same INTERNAL_API_KEY name, but from their own
# separate .env files, so the actual value must be copied to both.
internal:
  api-key: ${INTERNAL_API_KEY:}

# JWT Configuration (must match other services)
jwt:
  secret: ${JWT_SECRET:eW91ci12ZXJ5LXNlY3VyZS1qd3Qtc2VjcmV0LWtleS0zMi1ieXRlcyE=}

# Rate Limiting
rate-limit:
  requests-per-minute: 60

# ─── M-Pesa Daraja ────────────────────────────────────────────────────────────
mpesa:
  daraja:
    consumer-key: ${MPESA_CONSUMER_KEY}
    consumer-secret: ${MPESA_CONSUMER_SECRET}
    shortcode: ${MPESA_SHORTCODE}
    passkey: ${MPESA_PASSKEY}
    # STK push callback — must be HTTPS and publicly reachable (use ngrok locally)
    callback-url: ${MPESA_CALLBACK_URL}
    environment: ${MPESA_ENV:sandbox}
#   Safaricom Test Phone Numbers
#       254705912645
#       254708374149

    # Safaricom's public certificate, used to RSA-encrypt initiator passwords
    # into a SecurityCredential for B2C/B2B (see MpesaSecurityCredentialService).
    # Bundled at src/main/resources/certs/ — resolved via classpath, so no
    # scheme prefix needed. Sandbox and production certs are DIFFERENT files;
    # set MPESA_CERT_PATH=certs/ProductionCertificate.cer in production.
    certificate-path: ${MPESA_CERT_PATH:certs/SandboxCertificate.cer}

    # ── B2C (Business to Customer — disbursements/payouts to a phone number) ──
    b2c:
      initiator-name: ${MPESA_B2C_INITIATOR_NAME}
      # Plaintext initiator password — encrypted at runtime via certificate-path,
      # never sent to Safaricom in this form. Set MPESA_B2C_INITIATOR_PASSWORD in production.
      initiator-password: ${MPESA_B2C_INITIATOR_PASSWORD}
      shortcode: ${MPESA_B2C_SHORTCODE}
      command-id: ${MPESA_B2C_COMMAND_ID}   # SalaryPayment | BusinessPayment | PromotionPayment
      queue-timeout-url: ${MPESA_B2C_TIMEOUT_URL}
      result-url: ${MPESA_B2C_RESULT_URL}
      # Confirm actual tier limits with Safaricom for your shortcode.
      min-amount: 10
      max-amount: 150000

    # ── B2B (Business to Business) ──
    # NOTE: B2B is a permissioned API — confirm it's enabled for your
    # shortcode with Safaricom (account manager / Daraja portal) before
    # relying on this in production. commandId here defaults BusinessPayBill /
    # BusinessBuyGoods / etc. calls that don't specify their own commandId.
    b2b:
      initiator-name: ${MPESA_B2B_INITIATOR_NAME}
      initiator-password: ${MPESA_B2B_INITIATOR_PASSWORD}
      shortcode: ${MPESA_B2B_SHORTCODE}
      receiver-shortcode: ${MPESA_B2B_RECEIVER_SHORTCODE}
      command-id: ${MPESA_B2B_COMMAND_ID:BusinessPayBill}   # BusinessPayBill | BusinessBuyGoods | MerchantToMerchantTransfer | ...
      sender-identifier-type: ${MPESA_B2B_SENDER_IDENTIFIER_TYPE:4}
      receiver-identifier-type: ${MPESA_B2B_RECEIVER_IDENTIFIER_TYPE:4}
      queue-timeout-url: ${MPESA_B2B_TIMEOUT_URL}
      result-url: ${MPESA_B2B_RESULT_URL}
      min-amount: 10
      max-amount: 150000

    # ── C2B (Customer to Business — Register URL, Validation & Confirmation) ──
    c2b:
      shortcode: ${MPESA_C2B_SHORTCODE}
      response-type: ${MPESA_C2B_RESPONSE_TYPE}   # Completed | Cancelled
      validation-url: ${MPESA_C2B_VALIDATION_URL}
      confirmation-url: ${MPESA_C2B_CONFIRMATION_URL}

    # ── B2B Express Checkout (USSD Push to Till) ──
    # bearer token. See https://developer.safaricom.co.ke/apis/B2BExpressCheckout
    express-checkout:
      receiver-shortcode: ${MPESA_EXPRESS_CHECKOUT_RECEIVER_SHORTCODE}
      partner-name: ${MPESA_EXPRESS_CHECKOUT_PARTNER_NAME:Premisave}
      callback-url: ${MPESA_EXPRESS_CHECKOUT_CALLBACK_URL}

    # ── B2C Account Top Up (CommandID BusinessPayToBulk) ──
    # See https://developer.safaricom.co.ke/apis/B2CAccountTopUp
    account-top-up:
      initiator-name: ${MPESA_TOPUP_INITIATOR_NAME}
      initiator-password: ${MPESA_TOPUP_INITIATOR_PASSWORD}
      party-a: ${MPESA_TOPUP_PARTY_A}
      queue-timeout-url: ${MPESA_TOPUP_TIMEOUT_URL}
      result-url: ${MPESA_TOPUP_RESULT_URL}

    # ── Transaction Status API ──
    # Secondary reconciliation mechanism for C2B/B2B/B2C/Reversal transactions
    # whose ResultURL callback never arrived. See MpesaOperationsService.
    # https://developer.safaricom.co.ke/apis/TransactionStatus
    transaction-status:
      initiator-name: ${MPESA_STATUS_INITIATOR_NAME}
      initiator-password: ${MPESA_STATUS_INITIATOR_PASSWORD}
      party-a: ${MPESA_STATUS_PARTY_A}
      identifier-type: ${MPESA_STATUS_IDENTIFIER_TYPE:4}   # 1=MSISDN, 2=Till, 4=Shortcode
      queue-timeout-url: ${MPESA_STATUS_TIMEOUT_URL}
      result-url: ${MPESA_STATUS_RESULT_URL}

    # ── Account Balance API ──
    # Real-time balance inquiry across Working (MMF), Utility, and Charges
    # Paid accounts for our own shortcode. See MpesaOperationsService.
    # https://developer.safaricom.co.ke/apis/AccountBalance
    account-balance:
      initiator-name: ${MPESA_BALANCE_INITIATOR_NAME}
      initiator-password: ${MPESA_BALANCE_INITIATOR_PASSWORD}
      party-a: ${MPESA_BALANCE_PARTY_A}
      identifier-type: ${MPESA_BALANCE_IDENTIFIER_TYPE:4}
      queue-timeout-url: ${MPESA_BALANCE_TIMEOUT_URL}
      result-url: ${MPESA_BALANCE_RESULT_URL}

    # ── Reversal API ──
    # Reverses a completed C2B transaction (refunds the customer, debits our
    # shortcode). NOTE: B2C payouts cannot be reversed via API — portal only.
    # https://developer.safaricom.co.ke/apis/Reversal
    reversal:
      initiator-name: ${MPESA_REVERSAL_INITIATOR_NAME}
      initiator-password: ${MPESA_REVERSAL_INITIATOR_PASSWORD}
      receiver-party: ${MPESA_REVERSAL_RECEIVER_PARTY}
      receiver-identifier-type: ${MPESA_REVERSAL_RECEIVER_IDENTIFIER_TYPE:11}   # Must be 11 per Safaricom's spec
      queue-timeout-url: ${MPESA_REVERSAL_TIMEOUT_URL}
      result-url: ${MPESA_REVERSAL_RESULT_URL}

    # ── B2Pochi (Business to Pochi la Biashara) ──
    # Pays directly into a customer's Pochi business wallet instead of their
    # main M-Pesa balance. Requires a B2C shortcode / "one account" capable
    # of both receiving and disbursing.
    # https://developer.safaricom.co.ke/apis/BusinessToPochi
    b2-pochi:
      initiator-name: ${MPESA_POCHI_INITIATOR_NAME}
      initiator-password: ${MPESA_POCHI_INITIATOR_PASSWORD}
      party-a: ${MPESA_POCHI_PARTY_A}
      queue-timeout-url: ${MPESA_POCHI_TIMEOUT_URL}
      result-url: ${MPESA_POCHI_RESULT_URL}
      min-amount: 10
      max-amount: 250000

    # ── B2B Hakikisha (Query Org Info) ──

    # ── Pull Transactions API (C2B reconciliation) ──
      shortcode: ${MPESA_PULL_SHORTCODE}
      # The Safaricom MSISDN tied to this shortcode's KYC — found on the
      # M-PESA portal, NOT something you choose arbitrarily.
      nominated-number: ${MPESA_PULL_NOMINATED_NUMBER:254722000000}
      callback-url: ${MPESA_PULL_CALLBACK_URL}
      # Default lookback window (days) when a query doesn't specify dates. Max 2 (48h retention).
      pull-days: ${MPESA_PULL_DAYS:1}
      offset-value: ${MPESA_PULL_OFFSET:0}

# ─── Stripe ───────────────────────────────────────────────────────────────────
stripe:
  secret-key: ${STRIPE_SECRET_KEY}
  # Platform webhook — Dashboard → Webhooks → your endpoint → Signing secret.
  # Covers deposits (payment_intent.succeeded) and saved cards (setup_intent.succeeded).
  webhook-secret: ${STRIPE_WEBHOOK_SECRET}

  # ── Stripe Connect (bank withdrawal linking — international users only) ──
  # One-time manual setup required in the Dashboard before this works:
  # Settings → Connect → Onboarding options → configure which countries
  # Express accounts can onboard from (defaults to a narrow list otherwise).
  connect:
    # Where Stripe redirects the user if their onboarding link expired/was
    # already used — your frontend should re-request a fresh link
    # (POST /wallet/stripe/connect/link) and redirect again from there.
    refresh-url: ${STRIPE_CONNECT_REFRESH_URL}
    # Where Stripe redirects the user after finishing/exiting onboarding.
    return-url: ${STRIPE_CONNECT_RETURN_URL}
    # SEPARATE webhook endpoint from webhook-secret above — Dashboard →
    # Webhooks → new destination → "Listen to events on Connected accounts".
    # Covers account.updated, payout.paid, payout.failed.
    webhook-secret: ${STRIPE_CONNECT_WEBHOOK_SECRET}

# ─── PayPal ───────────────────────────────────────────────────────────────────
paypal:
  client-id: ${PAYPAL_CLIENT_ID}
  client-secret: ${PAYPAL_CLIENT_SECRET}
  environment: ${PAYPAL_ENV}   # "sandbox" or "production"
  webhook-id: ${PAYPAL_WEBHOOK_ID}
  return-url: ${PAYPAL_RETURN_URL}
  cancel-url: ${PAYPAL_CANCEL_URL}

# ─── Flutterwave ──────────────────────────────────────────────────────────────
flutterwave:
  client-id: ${FLUTTERWAVE_CLIENT_ID}
  client-secret: ${FLUTTERWAVE_CLIENT_SECRET}
  encryption-key: ${FLUTTERWAVE_ENCRYPTION_KEY}
  environment: ${FLUTTERWAVE_ENV:sandbox}   # "sandbox" or "production" — now DOES determine the base URL, see FlutterwaveConfig
  webhook-secret-hash: ${FLUTTERWAVE_WEBHOOK_SECRET_HASH}
  redirect-url: ${FLUTTERWAVE_REDIRECT_URL}
  # SANDBOX TESTING ONLY — see FlutterwaveConfig.sandboxScenarioKey javadoc.
  # Leave unset in production.
  sandbox-scenario-key: ${FLUTTERWAVE_SANDBOX_SCENARIO_KEY:}
  transfer:
    min-amount: 1
    max-amount: 5000

# Frontend URL for CORS
frontend:
  url: ${FRONTEND_URL:http://localhost:3000}

logging:
  level:
    "[com.premisave]": DEBUG
    "[org.springframework.data.mongodb]": WARN
    "[org.springframework.data.repository.config.RepositoryConfigurationExtensionSupport]": ERROR
    "[org.springframework.cloud.commons.util.InetUtils]": ERROR