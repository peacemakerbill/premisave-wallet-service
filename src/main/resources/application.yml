spring:
  application:
    name: premisave-wallet-service

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/premisave-wallet}
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  cloud:
    discovery:
      enabled: false

server:
  port: 8084

# Auth Service Integration
auth:
  service:
    url: ${AUTH_SERVICE_URL:http://localhost:8080}
    # Must match the API_KEY set in the auth service .env
    api-key: ${AUTH_SERVICE_API_KEY:replace-this-in-production}

# Shared secret internal services present via X-API-Key when calling
# wallet-service's /internal/** endpoints (see InternalApiKeyFilter).
# Must match property-service's app.api-key (INTERNAL_API_KEY env var) —
# both services read the same INTERNAL_API_KEY name, but from their own
# separate .env files, so the actual value must be copied to both.
internal:
  api-key: ${INTERNAL_API_KEY:}

# JWT Configuration (must match other services)
jwt:
  secret: ${JWT_SECRET:eW91ci12ZXJ5LXNlY3VyZS1qd3Qtc2VjcmV0LWtleS0zMi1ieXRlcyE=}

# Rate Limiting
rate-limit:
  requests-per-minute: 60

# ─── M-Pesa Daraja ────────────────────────────────────────────────────────────
mpesa:
  daraja:
    consumer-key: ${MPESA_CONSUMER_KEY:your_consumer_key}
    consumer-secret: ${MPESA_CONSUMER_SECRET:your_consumer_secret}
    shortcode: ${MPESA_SHORTCODE:174379}
    passkey: ${MPESA_PASSKEY:your_passkey}
    # STK push callback — must be HTTPS and publicly reachable (use ngrok locally)
    callback-url: ${MPESA_CALLBACK_URL:https://your-domain.com/payments/mpesa/callback}
    environment: ${MPESA_ENV:sandbox}

    # Safaricom's public certificate, used to RSA-encrypt initiator passwords
    # into a SecurityCredential for B2C/B2B (see MpesaSecurityCredentialService).
    # Bundled at src/main/resources/certs/ — resolved via classpath, so no
    # scheme prefix needed. Sandbox and production certs are DIFFERENT files;
    # set MPESA_CERT_PATH=certs/ProductionCertificate.cer in production.
    certificate-path: ${MPESA_CERT_PATH:certs/SandboxCertificate.cer}

    # ── B2C (Business to Customer — disbursements/payouts to a phone number) ──
    b2c:
      initiator-name: ${MPESA_B2C_INITIATOR_NAME:your_initiator_name}
      # Plaintext initiator password — encrypted at runtime via certificate-path,
      # never sent to Safaricom in this form. Set MPESA_B2C_INITIATOR_PASSWORD in production.
      initiator-password: ${MPESA_B2C_INITIATOR_PASSWORD:your_initiator_password}
      shortcode: ${MPESA_B2C_SHORTCODE:600000}
      command-id: ${MPESA_B2C_COMMAND_ID:BusinessPayment}   # SalaryPayment | BusinessPayment | PromotionPayment
      queue-timeout-url: ${MPESA_B2C_TIMEOUT_URL:https://your-domain.com/payments/mpesa/b2c/timeout}
      result-url: ${MPESA_B2C_RESULT_URL:https://your-domain.com/payments/mpesa/b2c/result}
      # Confirm actual tier limits with Safaricom for your shortcode.
      min-amount: 10
      max-amount: 150000

    # ── B2B (Business to Business) ──
    # NOTE: B2B is a permissioned API — confirm it's enabled for your
    # shortcode with Safaricom (account manager / Daraja portal) before
    # relying on this in production. commandId here defaults BusinessPayBill /
    # BusinessBuyGoods / etc. calls that don't specify their own commandId.
    b2b:
      initiator-name: ${MPESA_B2B_INITIATOR_NAME:your_initiator_name}
      initiator-password: ${MPESA_B2B_INITIATOR_PASSWORD:your_initiator_password}
      shortcode: ${MPESA_B2B_SHORTCODE:600000}
      receiver-shortcode: ${MPESA_B2B_RECEIVER_SHORTCODE:600001}
      command-id: ${MPESA_B2B_COMMAND_ID:BusinessPayBill}   # BusinessPayBill | BusinessBuyGoods | MerchantToMerchantTransfer | ...
      sender-identifier-type: ${MPESA_B2B_SENDER_IDENTIFIER_TYPE:4}
      receiver-identifier-type: ${MPESA_B2B_RECEIVER_IDENTIFIER_TYPE:4}
      queue-timeout-url: ${MPESA_B2B_TIMEOUT_URL:https://your-domain.com/payments/mpesa/b2b/timeout}
      result-url: ${MPESA_B2B_RESULT_URL:https://your-domain.com/payments/mpesa/b2b/result}
      min-amount: 10
      max-amount: 150000

    # ── C2B (Customer to Business — Register URL, Validation & Confirmation) ──
    c2b:
      shortcode: ${MPESA_C2B_SHORTCODE:174379}
      response-type: ${MPESA_C2B_RESPONSE_TYPE:Completed}   # Completed | Cancelled
      validation-url: ${MPESA_C2B_VALIDATION_URL:https://your-domain.com/payments/mpesa/c2b/validation}
      confirmation-url: ${MPESA_C2B_CONFIRMATION_URL:https://your-domain.com/payments/mpesa/c2b/confirmation}

    # ── B2B Express Checkout (USSD Push to Till) ──
    # Prompts a merchant to pay one of our shortcodes directly from their own
    # till, via a USSD PIN prompt (as opposed to STK Push to a personal line).
    # No initiator/security credential needed — auth is via the normal OAuth
    # bearer token. See https://developer.safaricom.co.ke/apis/B2BExpressCheckout
    express-checkout:
      receiver-shortcode: ${MPESA_EXPRESS_CHECKOUT_RECEIVER_SHORTCODE:174379}
      partner-name: ${MPESA_EXPRESS_CHECKOUT_PARTNER_NAME:Premisave}
      callback-url: ${MPESA_EXPRESS_CHECKOUT_CALLBACK_URL:https://your-domain.com/payments/mpesa/b2b/express-checkout/result}

    # ── B2C Account Top Up (CommandID BusinessPayToBulk) ──
    # Loads funds from our working/MMF account into a B2C shortcode's utility
    # account so disbursements don't run dry. Hits the same /mpesa/b2b/v1/paymentrequest
    # endpoint as the generic B2B calls above, but is a distinct Safaricom
    # product with its own initiator credentials.
    # See https://developer.safaricom.co.ke/apis/B2CAccountTopUp
    account-top-up:
      initiator-name: ${MPESA_TOPUP_INITIATOR_NAME:your_initiator_name}
      initiator-password: ${MPESA_TOPUP_INITIATOR_PASSWORD:your_initiator_password}
      party-a: ${MPESA_TOPUP_PARTY_A:600000}
      queue-timeout-url: ${MPESA_TOPUP_TIMEOUT_URL:https://your-domain.com/payments/mpesa/b2b/timeout}
      result-url: ${MPESA_TOPUP_RESULT_URL:https://your-domain.com/payments/mpesa/b2b/result}

    # ── Transaction Status API ──
    # Not yet wired to a service — reserved for full automatic reconciliation
    # of stuck B2C/B2B disbursements (see DisbursementService.flagStuckDisbursements).
    transaction-status:
      initiator-name: ${MPESA_STATUS_INITIATOR_NAME:your_initiator_name}
      initiator-password: ${MPESA_STATUS_INITIATOR_PASSWORD:your_initiator_password}
      security-credential: ${MPESA_STATUS_SECURITY_CREDENTIAL:your_security_credential}
      party-a: ${MPESA_STATUS_PARTY_A:600000}
      identifier-type: ${MPESA_STATUS_IDENTIFIER_TYPE:4}   # 1=MSISDN, 2=Till, 4=Shortcode
      queue-timeout-url: ${MPESA_STATUS_TIMEOUT_URL:https://your-domain.com/payments/mpesa/status/timeout}
      result-url: ${MPESA_STATUS_RESULT_URL:https://your-domain.com/payments/mpesa/status/result}

    # ── Account Balance / Pull Transactions API ──
    pull-transactions:
      initiator-name: ${MPESA_PULL_INITIATOR_NAME:your_initiator_name}
      initiator-password: ${MPESA_PULL_INITIATOR_PASSWORD:your_initiator_password}
      security-credential: ${MPESA_PULL_SECURITY_CREDENTIAL:your_security_credential}
      shortcode: ${MPESA_PULL_SHORTCODE:600000}
      # Pull API onboarding is a one-time registration with Safaricom
      register-url: ${MPESA_PULL_REGISTER_URL:https://your-domain.com/payments/mpesa/pull/register}
      callback-url: ${MPESA_PULL_CALLBACK_URL:https://your-domain.com/payments/mpesa/pull/callback}
      # How far back to pull, e.g. "1" for last 1 day
      pull-days: ${MPESA_PULL_DAYS:1}
      offset-value: ${MPESA_PULL_OFFSET:0}

# ─── Stripe ───────────────────────────────────────────────────────────────────
stripe:
  secret-key: ${STRIPE_SECRET_KEY:sk_test_your_stripe_secret_key}
  # Get this from Stripe Dashboard → Webhooks → your endpoint → Signing secret
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_your_webhook_signing_secret}

# ─── PayPal ───────────────────────────────────────────────────────────────────
paypal:
  client-id: ${PAYPAL_CLIENT_ID:your_paypal_client_id}
  client-secret: ${PAYPAL_CLIENT_SECRET:your_paypal_client_secret}
  environment: ${PAYPAL_ENV:sandbox}   # "sandbox" or "production"

# Frontend URL for CORS
frontend:
  url: ${FRONTEND_URL:http://localhost:3000}

logging:
  level:
    "[com.premisave]": DEBUG
    "[org.springframework.data.mongodb]": WARN
    "[org.springframework.data.repository.config.RepositoryConfigurationExtensionSupport]": ERROR
    "[org.springframework.cloud.commons.util.InetUtils]": ERROR