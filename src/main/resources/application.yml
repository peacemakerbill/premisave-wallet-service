spring:
  application:
    name: premisave-wallet-service

  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/premisave-wallet}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  cloud:
    discovery:
      enabled: false

server:
  port: 8084

# Auth Service Integration
auth:
  service:
    url: ${AUTH_SERVICE_URL:http://localhost:8080}
    # api-key removed from here entirely — AuthServiceFeignConfig (or
    # whichever class calls auth-service) must now read internal.api-key
    # directly instead of auth.service.api-key. One shared key across every
    # microservice, with no separate property path aliasing it.

# Shared secret internal services present via X-API-Key when calling
# wallet-service's /internal/** endpoints (see InternalApiKeyFilter), AND
# also used by wallet-service itself when it calls OUT to auth-service —
# ONE key, reused everywhere, read directly from here rather than through
# a separate auth.service.api-key alias.
# Must match property-service's app.api-key (INTERNAL_API_KEY env var) --
# every service reads the same INTERNAL_API_KEY name, but from its own
# separate .env file, so the actual value must be copied identically to
# all of them.
internal:
  api-key: ${INTERNAL_API_KEY}

# JWT Configuration (must match other services)
jwt:
  secret: ${JWT_SECRET:eW91ci12ZXJ5LXNlY3VyZS1qd3Qtc2VjcmV0LWtleS0zMi1ieXRlcyE=}

# Rate Limiting
rate-limit:
  requests-per-minute: 60

# ─── M-Pesa Daraja ────────────────────────────────────────────────────────────
mpesa:
  daraja:
    consumer-key: ${MPESA_CONSUMER_KEY}
    consumer-secret: ${MPESA_CONSUMER_SECRET}
    shortcode: ${MPESA_SHORTCODE}
    passkey: ${MPESA_PASSKEY}
    # STK push callback — must be HTTPS and publicly reachable (use ngrok locally)
    callback-url: ${MPESA_CALLBACK_URL}
    environment: ${MPESA_ENV:sandbox}
#   Safaricom Test Phone Numbers
#       254705912645
#       254708374149

    # Safaricom's public certificate, used to RSA-encrypt initiator passwords
    # into a SecurityCredential for B2C/B2B (see MpesaSecurityCredentialService).
    # Bundled at src/main/resources/certs/ — resolved via classpath, so no
    # scheme prefix needed. Sandbox and production certs are DIFFERENT files;
    # set MPESA_CERT_PATH=certs/ProductionCertificate.cer in production.
    certificate-path: ${MPESA_CERT_PATH:certs/SandboxCertificate.cer}

    # ── B2C (Business to Customer — disbursements/payouts to a phone number) ──
    b2c:
      initiator-name: ${MPESA_B2C_INITIATOR_NAME}
      # Plaintext initiator password — encrypted at runtime via certificate-path,
      # never sent to Safaricom in this form. Set MPESA_B2C_INITIATOR_PASSWORD in production.
      initiator-password: ${MPESA_B2C_INITIATOR_PASSWORD}
      shortcode: ${MPESA_B2C_SHORTCODE}
      command-id: ${MPESA_B2C_COMMAND_ID}   # SalaryPayment | BusinessPayment | PromotionPayment
      queue-timeout-url: ${MPESA_B2C_TIMEOUT_URL}
      result-url: ${MPESA_B2C_RESULT_URL}
      # Confirm actual tier limits with Safaricom for your shortcode.
      min-amount: 10
      max-amount: 150000

    # ── B2B (Business to Business) ──
    # code with Safaricom (account manager / Daraja portal) before
    # relying on this in production. commandId here defaults BusinessPayBill /
    # BusinessBuyGoods / etc. calls that don't specify their own commandId.
    b2b:
      initiator-name: ${MPESA_B2B_INITIATOR_NAME}
      initiator-password: ${MPESA_B2B_INITIATOR_PASSWORD}
      shortcode: ${MPESA_B2B_SHORTCODE}
      receiver-shortcode: ${MPESA_B2B_RECEIVER_SHORTCODE}
      command-id: ${MPESA_B2B_COMMAND_ID:BusinessPayBill}   # BusinessPayBill | BusinessBuyGoods | MerchantToMerchantTransfer | ...
      sender-identifier-type: ${MPESA_B2B_SENDER_IDENTIFIER_TYPE:4}
      receiver-identifier-type: ${MPESA_B2B_RECEIVER_IDENTIFIER_TYPE:4}
      queue-timeout-url: ${MPESA_B2B_TIMEOUT_URL}
      result-url: ${MPESA_B2B_RESULT_URL}
      min-amount: 10
      max-amount: 150000

    # ── C2B (Customer to Business — Register URL, Validation & Confirmation) ──
    c2b:
      shortcode: ${MPESA_C2B_SHORTCODE}
      response-type: ${MPESA_C2B_RESPONSE_TYPE}   # Completed | Cancelled
      validation-url: ${MPESA_C2B_VALIDATION_URL}
      confirmation-url: ${MPESA_C2B_CONFIRMATION_URL}

    # ── Transaction Status API ──
    # Secondary reconciliation mechanism for C2B/B2B/B2C/Reversal transactions
    # whose ResultURL callback never arrived. See MpesaOperationsService.
    # https://developer.safaricom.co.ke/apis/TransactionStatus
    transaction-status:
      initiator-name: ${MPESA_STATUS_INITIATOR_NAME}
      initiator-password: ${MPESA_STATUS_INITIATOR_PASSWORD}
      party-a: ${MPESA_STATUS_PARTY_A}
      identifier-type: ${MPESA_STATUS_IDENTIFIER_TYPE:4}   # 1=MSISDN, 2=Till, 4=Shortcode
      queue-timeout-url: ${MPESA_STATUS_TIMEOUT_URL}
      result-url: ${MPESA_STATUS_RESULT_URL}

    # ── Account Balance API ──
    # Real-time balance inquiry across Working (MMF), Utility, and Charges
    # Paid accounts for our own shortcode. See MpesaOperationsService.
    # https://developer.safaricom.co.ke/apis/AccountBalance
    account-balance:
      initiator-name: ${MPESA_BALANCE_INITIATOR_NAME}
      initiator-password: ${MPESA_BALANCE_INITIATOR_PASSWORD}
      party-a: ${MPESA_BALANCE_PARTY_A}
      identifier-type: ${MPESA_BALANCE_IDENTIFIER_TYPE:4}
      queue-timeout-url: ${MPESA_BALANCE_TIMEOUT_URL}
      result-url: ${MPESA_BALANCE_RESULT_URL}

    # ── Reversal API ──
    # Reverses a completed C2B transaction (refunds the customer, debits our
    # shortcode). B2C payouts cannot be reversed via API — portal only.
    # https://developer.safaricom.co.ke/apis/Reversal
    reversal:
      initiator-name: ${MPESA_REVERSAL_INITIATOR_NAME}
      initiator-password: ${MPESA_REVERSAL_INITIATOR_PASSWORD}
      receiver-party: ${MPESA_REVERSAL_RECEIVER_PARTY}
      receiver-identifier-type: ${MPESA_REVERSAL_RECEIVER_IDENTIFIER_TYPE:11}   # Must be 11 per Safaricom's spec
      queue-timeout-url: ${MPESA_REVERSAL_TIMEOUT_URL}
      result-url: ${MPESA_REVERSAL_RESULT_URL}

    # ── B2Pochi (Business to Pochi la Biashara) ──
    # Pays directly into a customer's Pochi business wallet instead of their
    # main M-Pesa balance. Requires a B2C shortcode / "one account" capable
    # of both receiving and disbursing.
    # https://developer.safaricom.co.ke/apis/BusinessToPochi
    b2-pochi:
      initiator-name: ${MPESA_POCHI_INITIATOR_NAME}
      initiator-password: ${MPESA_POCHI_INITIATOR_PASSWORD}
      party-a: ${MPESA_POCHI_PARTY_A}
      queue-timeout-url: ${MPESA_POCHI_TIMEOUT_URL}
      result-url: ${MPESA_POCHI_RESULT_URL}
      min-amount: 10
      max-amount: 250000

    # ── B2B Hakikisha (Query Org Info) ──
    # No dedicated config block — see MpesaConfig.queryOrgInfoUrl(), derived from baseUrl().

    # ── Pull Transactions API (C2B reconciliation) ──
    pull-transactions:
      shortcode: ${MPESA_PULL_SHORTCODE}
      # The Safaricom MSISDN tied to this shortcode's KYC — found on the
      # M-PESA portal, NOT something you choose arbitrarily.
      nominated-number: ${MPESA_PULL_NOMINATED_NUMBER}
      callback-url: ${MPESA_PULL_CALLBACK_URL}
      # Default lookback window (days) when a query doesn't specify dates. Max 2 (48h retention).
      pull-days: ${MPESA_PULL_DAYS}
      offset-value: ${MPESA_PULL_OFFSET:0}

# ─── Stripe ───────────────────────────────────────────────────────────────────
stripe:
  secret-key: ${STRIPE_SECRET_KEY}
  # Platform webhook — Dashboard → Webhooks → your endpoint → Signing secret.
  # Covers deposits (payment_intent.succeeded) and saved cards (setup_intent.succeeded).
  webhook-secret: ${STRIPE_WEBHOOK_SECRET}

  # ── Stripe Connect (bank withdrawal linking — international users only) ──
  # One-time manual setup required in the Dashboard before this works:
  # Settings → Connect → Onboarding options → configure which countries
  # Express accounts can onboard from (defaults to a narrow list otherwise).
  connect:
    # Where Stripe redirects the user if their onboarding link expired/was
    # already used — your frontend should re-request a fresh link
    # (POST /wallet/stripe/connect/link) and redirect again from there.
    refresh-url: ${STRIPE_CONNECT_REFRESH_URL}
    # Where Stripe redirects the user after finishing/exiting onboarding.
    return-url: ${STRIPE_CONNECT_RETURN_URL}
    # SEPARATE webhook endpoint from webhook-secret above — Dashboard →
    # Webhooks → new destination → "Listen to events on Connected accounts".
    # Covers account.updated, payout.paid, payout.failed.
    webhook-secret: ${STRIPE_CONNECT_WEBHOOK_SECRET}

# ─── PayPal ───────────────────────────────────────────────────────────────────
paypal:
  client-id: ${PAYPAL_CLIENT_ID}
  client-secret: ${PAYPAL_CLIENT_SECRET}
  environment: ${PAYPAL_ENV}   # "sandbox" or "production"
  webhook-id: ${PAYPAL_WEBHOOK_ID}
  return-url: ${PAYPAL_RETURN_URL}
  cancel-url: ${PAYPAL_CANCEL_URL}

# ─── Flutterwave ──────────────────────────────────────────────────────────────
flutterwave:
  client-id: ${FLUTTERWAVE_CLIENT_ID}
  client-secret: ${FLUTTERWAVE_CLIENT_SECRET}
  encryption-key: ${FLUTTERWAVE_ENCRYPTION_KEY}
  environment: ${FLUTTERWAVE_ENV:sandbox}   # "sandbox" or "production" — now DOES determine the base URL, see FlutterwaveConfig
  webhook-secret-hash: ${FLUTTERWAVE_WEBHOOK_SECRET_HASH}
  redirect-url: ${FLUTTERWAVE_REDIRECT_URL}
  # SANDBOX TESTING ONLY — see FlutterwaveConfig.sandboxScenarioKey javadoc.
  # Leave unset in production.
  sandbox-scenario-key: ${FLUTTERWAVE_SANDBOX_SCENARIO_KEY:}
  transfer:
    min-amount: 1
    max-amount: 5000

# ─── NOWPayments (crypto) ─────────────────────────────────────────────────────
# No sandbox tunnel/CLI tooling exists like Stripe CLI's `stripe listen` —
# callback-url below must be a real reachable HTTPS URL (zrok/ngrok in dev)
# even while testing in sandbox. See NowPaymentsConfig for the full javadoc.
nowpayments:
  # https://api-sandbox.nowpayments.io for testing, https://api.nowpayments.io for production
  base-url: ${NOWPAYMENTS_BASE_URL:https://api-sandbox.nowpayments.io}
  # Dashboard → Settings → Payments → API keys
  api-key: ${NOWPAYMENTS_API_KEY}
  # Dashboard → Settings → Payments → Instant payment notifications.
  # NOT interchangeable between sandbox/production — see NowPaymentsService.verifyIpnSignature.
  ipn-secret: ${NOWPAYMENTS_IPN_SECRET}
  # Sent as ipn_callback_url on every Create Payment request.
  callback-url: ${NOWPAYMENTS_CALLBACK_URL}
  # Your NOWPayments DASHBOARD LOGIN (not the API key above) — required only
  # for payouts, via POST /v1/auth. See NowPaymentsConfig for why this is a
  # meaningfully more sensitive secret than everything else in this block.
  payout-email: ${NOWPAYMENTS_PAYOUT_EMAIL:}
  payout-password: ${NOWPAYMENTS_PAYOUT_PASSWORD:}

# ─── Commission rates ─────────────────────────────────────────────────────
# See CommissionConfig for the full reasoning. Both are decimal fractions
# (0.01 = 1%, not 1). Defaults below (1% internal / 3% gateway) are the
# actual chosen rates, roughly in line with typical real-world payment
# processing fees — not placeholders anymore.
commission:
  # Internal wallet-to-wallet transfers — expected lower than gateway-rate.
  internal-transfer-rate: ${COMMISSION_INTERNAL_TRANSFER_RATE:0.01}
  # Gateway-bound disbursements (M-Pesa B2C/B2Pochi, PayPal, Stripe, Flutterwave, NOWPayments).
  gateway-rate: ${COMMISSION_GATEWAY_RATE:0.03}
  # The configured rates can be read by other services at GET /internal/commission/rates.

# Frontend URL for CORS
frontend:
  url: ${FRONTEND_URL:http://localhost:3000}

# ─── Exchange Rate refresh ─────────────────────────────────────────────────
# See ExchangeRateService — refreshIntervalMs is read directly by the
# @Scheduled annotation itself via a property placeholder, not through
# this properties class at annotation-processing time; both are kept in
# sync with the same default (10 minutes) regardless. On every startup, and
# then every interval, all rates for base-currency are fetched from
# Frankfurter and overwrite what is stored.
exchange-rate:
  refresh-interval-ms: ${EXCHANGE_RATE_REFRESH_INTERVAL_MS:600000}
  base-currency: ${EXCHANGE_RATE_BASE_CURRENCY:USD}
  max-retries: ${EXCHANGE_RATE_MAX_RETRIES:3}

# ─── Notifications ─────────────────────────────────────────────────────────
# See MpesaDisbursementService.notifyB2BRecipients — B2B never touches a
# customer wallet, so there's no wallet owner's email to notify the way
# B2C/B2Pochi have; this is who gets the success/failure email instead.
# Comma-separated, no spaces required around commas (trimmed either way).
# Empty/unset is safe — logs a warning and sends nothing, never throws.
notifications:
  b2b-recipients: ${B2B_NOTIFICATION_RECIPIENTS:}

# ─── SpringDoc / Swagger UI ─────────────────────────────────────────────────
# Disabled outright — SecurityConfig's permitAll() list still names these
# paths, but with the endpoints themselves off there's nothing left at
# them to expose either way. Also silences springdoc's own startup
# warning about these being publicly reachable by default (springdoc
# logs it unconditionally regardless of this property's value — a known,
# still-open springdoc-openapi issue, not something this setting can
# suppress on its own; disabling the endpoints for real is what removes it).
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    "[com.premisave]": DEBUG
    "[org.springframework.data.mongodb]": WARN
    "[org.springframework.data.repository.config.RepositoryConfigurationExtensionSupport]": ERROR
    "[org.springframework.cloud.commons.util.InetUtils]": ERROR

# Commercial (payment service provider) API. Called only by the developer service.
# Every value has a safe default, so this whole block is optional.
#
# serves: live, sandbox or both. Production should run one deployment per
# environment, each with its own database and provider credentials. Use both
# only for local development.
commercial:
  enabled: ${COMMERCIAL_ENABLED:true}
  serves: ${COMMERCIAL_SERVES:both}
  currencies: ${COMMERCIAL_CURRENCIES:USD,KES}
  quote-ttl-seconds: 900
  signing:
    # When enabled, every request must carry X-Timestamp and X-Signature
    # (HMAC-SHA256 over timestamp, method, path with query and body hash).
    # Several secrets may be listed so a secret can be rotated without downtime.
    enabled: ${COMMERCIAL_SIGNING_ENABLED:false}
    secrets: ${COMMERCIAL_SIGNING_SECRETS:}
    replay-window-seconds: 300
  events:
    # Where outbox events are forwarded for delivery to merchant URLs.
    # This address is also used by the developer search (GET /internal/commercial/v1/developers).
    # The developer service does not accept events yet (a later slice adds POST /internal/events),
    # so while it does not, set COMMERCIAL_EVENTS_DISPATCHER_ENABLED=false: the search works and
    # events wait safely in the outbox instead of failing and retrying. With the address empty the
    # search answers NOT_CONFIGURED and the dispatcher logs a warning once at startup.
    developer-service-url: ${DEVELOPER_SERVICE_URL:}
    api-key: ${DEVELOPER_SERVICE_API_KEY:}
    signing-secret: ${COMMERCIAL_EVENTS_SIGNING_SECRET:}
    max-attempts: 12
    dispatch-batch-size: 50
    http-timeout-seconds: 10
    dispatcher-enabled: ${COMMERCIAL_EVENTS_DISPATCHER_ENABLED:true}
    dispatch-interval-ms: 2000
  sandbox:
    # Delay before a sandbox payment or payout that follows the test amount
    # rules is resolved automatically.
    auto-resolve-delay-ms: 3000
    redirect-base: ${COMMERCIAL_SANDBOX_REDIRECT_BASE:https://sandbox.invalid}
  registrations:
    max-per-app: 10
  mpesa:
    # Live M-Pesa for the commercial API. Reuses the Daraja credentials under
    # mpesa.daraja.*. Point mpesa.daraja.environment at sandbox to try the live
    # path with Safaricom test money.
    enabled: ${COMMERCIAL_MPESA_ENABLED:false}
    # Public https address Safaricom can reach, with no trailing path.
    callback-base-url: ${COMMERCIAL_MPESA_CALLBACK_BASE_URL:}
    # Signs the callback addresses. At least 16 characters.
    callback-secret: ${COMMERCIAL_MPESA_CALLBACK_SECRET:}
    collection-max-kes: 250000
    poll-after-seconds: 60
    poll-interval-ms: 30000
    http-timeout-seconds: 15
  indexes:
    # Creates the indexes declared on the commercial documents at startup. Several guarantees
    # (unique idempotency keys, one ledger line per operation) depend on them.
    ensure: true
  settlements:
    # Runs the automatic settlement schedules merchants have saved.
    scheduler-enabled: true
    scheduler-interval-ms: 60000
  transfers:
    # Finishes transfers that were held but not completed, for example after a restart.
    recovery-interval-ms: 30000
  links:
    # Public address of the checkout page that the developer service serves. A payment link's url is
    # this address plus /pay/{id}. Without one the url is the relative path /pay/{id}.
    checkout-base-url: ${COMMERCIAL_LINKS_CHECKOUT_BASE_URL:}
    # Same, for sandbox links. Falls back to checkout-base-url.
    sandbox-checkout-base-url: ${COMMERCIAL_LINKS_SANDBOX_CHECKOUT_BASE_URL:}
  batches:
    # Bulk payouts are sent to their rails at a steady pace: this many per run, one run every
    # dispatch-interval-ms (ten every two seconds is about five a second).
    items-per-run: 10
    dispatch-interval-ms: 2000
    dispatcher-enabled: true
    # A payout handed to a provider that never answered is closed as timed out after this long.
    stuck-after-minutes: 60
    max-items: 500
  beneficiary:
    # How long a provider's answer about a destination is reused before the provider is asked again.
    cache-hours: 24
  refunds:
    # A refund above this many USD is returned with requiresApproval true. Until the approval
    # workflow is decided the flag is informational and the refund still proceeds.
    approval-threshold-usd: 1000
    # How often, in milliseconds, wallet credit refunds that stopped part way are finished.
    recovery-interval-ms: 30000
  disputes:
    # Days a merchant has to answer a dispute opened by the sandbox helper. Real disputes carry the provider's deadline.
    evidence-window-days: 14
    # How often, in milliseconds, disputes interrupted while opening or settling are finished.
    recovery-interval-ms: 30000
  billing:
    # Runs subscription billing: bills periods that have ended, retries failed invoices,
    # finishes stalled attempts, resumes paused subscriptions and sends invoice.upcoming.
    scheduler-enabled: true
    scheduler-interval-ms: 60000
    # How many days before a billing date invoice.upcoming is sent (1 to 30).
    upcoming-days: 3
    # Minutes an attempt may sit unresolved before the recovery sweep looks at it. Keep this
    # above 5, the minutes an Idempotency-Key is held while its request runs (minimum 6).
    stuck-minutes: 10
    # The most subscriptions, invoices or notices handled per step of one scheduler run (1 to 1000).
    batch-size: 100
    # Sandbox advance-clock helper: milliseconds to wait for each payment to settle (0 to 30000).
    clock-wait-ms: 3000
  rails:
    # Live provider rails other than M-Pesa. Every rail is off until its enabled flag is true, and each
    # reuses the credentials already configured for the wallet service (stripe.*, paypal.*, flutterwave.*,
    # nowpayments.*). Currencies a rail serves must also be listed in commercial.currencies.
    http-timeout-seconds: 20
    polling:
      # Looks open payments, payouts and refunds up with their provider, and finishes pending payment
      # methods, so a lost or late webhook is picked up. Needed for Flutterwave, NOWPayments and PayPal.
      enabled: true
      interval-ms: 20000
      after-seconds: 15
      batch-size: 50
    stripe:
      enabled: ${COMMERCIAL_STRIPE_ENABLED:false}
      # Returned to the customer's browser with a card payment.
      publishable-key: ${COMMERCIAL_STRIPE_PUBLISHABLE_KEY:}
      # Signing secret of the commercial webhook destination in the Stripe Dashboard
      # (endpoint /payments/commercial/rail/webhook/stripe). Not the wallet service's secret.
      webhook-secret: ${COMMERCIAL_STRIPE_WEBHOOK_SECRET:}
      currencies: USD
      min-usd-cents: 50
      max-usd-cents: 10000000
      webhook-tolerance-seconds: 300
      setup-timeout-hours: 24
    paypal:
      enabled: ${COMMERCIAL_PAYPAL_ENABLED:false}
      currencies: USD
      min-usd-cents: 100
      max-usd-cents: 10000000
      setup-timeout-hours: 24
    flutterwave:
      enabled: ${COMMERCIAL_FLUTTERWAVE_ENABLED:false}
      # Local currencies mobile money is collected in (Kenya stays on M-Pesa) and bank payout currencies.
      mobile-money-currencies: GHS,UGX,TZS,RWF,ZMW
      bank-currencies: NGN,GHS,KES,UGX,TZS,RWF,ZAR
      # Currency of the Flutterwave balance that transfers are paid from.
      source-currency: USD
      # Placeholder customer email for a customer who gave only a phone number.
      customer-email-domain: payments.premisave.com
      min-usd-cents: 50
      max-usd-cents: 5000000
    nowpayments:
      enabled: ${COMMERCIAL_NOWPAYMENTS_ENABLED:false}
      default-pay-currency: usdttrc20
      min-usd-cents: 500
      max-usd-cents: 10000000
    premisave:
      # Premisave wallets as a payment method (the owner approves in the app) and a payout destination.
      enabled: ${COMMERCIAL_PREMISAVE_ENABLED:false}
      # Minutes a wallet owner has to approve a payment.
      consent-minutes: 15
      # The largest single charge a standing approval (subscription) can be given.
      mandate-max-usd-cents: 50000
      # Hours a wallet owner has to approve a standing approval.
      mandate-hours: 48
      min-usd-cents: 1
      max-usd-cents: 5000000
  c2b:
    # Paybill payments by account reference. Needs commercial.mpesa.enabled too.
    enabled: ${COMMERCIAL_C2B_ENABLED:false}
    # The paybill customers pay. Safaricom keeps one address pair per paybill, so use one that is not
    # already registered for the wallet service's deposits, or route both with CommercialC2bRouter.
    shortcode: ${COMMERCIAL_C2B_SHORTCODE:}
    # What Safaricom does when our validation address cannot be reached: Completed or Cancelled.
    response-type: Cancelled
    # Ask the merchant's registered VALIDATION callback before accepting a payment.
    merchant-validation: true
    validation-deadline-ms: 3000
    # Register the validation and confirmation addresses with Safaricom at start up. Otherwise call
    # POST /internal/commercial/v1/c2b/register-urls once.
    register-on-startup: false
    # Seconds a recorded but uncredited payment waits before it is tried again, and how often that is checked.
    reprocess-after-seconds: 60
    sweep-interval-ms: 30000
  onboarding:
    # Merchant application form, document review and approval. Approving an application switches production on.
    enabled: ${COMMERCIAL_ONBOARDING_ENABLED:true}
    # Document types an application must hold, and have accepted by a reviewer, before it can be approved.
    # Types: BUSINESS_REGISTRATION, CERTIFICATE_OF_INCORPORATION, TAX_COMPLIANCE, DIRECTOR_ID,
    # PROOF_OF_ADDRESS, BANK_STATEMENT, OTHER.
    required-documents: [BUSINESS_REGISTRATION, TAX_COMPLIANCE, DIRECTOR_ID]
    # Largest file in bytes (hard ceiling 8 MB) and the most files per application.
    max-document-bytes: 5242880
    max-documents: 20
    # Addresses told when an application is submitted or resubmitted. Comma separated. Empty sends nothing.
    staff-notify-emails: ${COMMERCIAL_ONBOARDING_STAFF_EMAILS:}
    # Sender of onboarding emails. Empty uses the mail account's own address.
    mail-from: ${COMMERCIAL_ONBOARDING_MAIL_FROM:}
    # Which staff role may do what. The role arrives in the X-Actor-Role header, compared without case.
    roles:
      review: [FINANCE, OPERATIONS, ADMIN]
      return-for-correction: [FINANCE, OPERATIONS, ADMIN]
      approve: [FINANCE, ADMIN]
      reject: [FINANCE, OPERATIONS, ADMIN]
      reopen: [ADMIN]
    storage:
      # ------------------------------------------------------------------------------------------------
      # Where onboarding documents (identity and tax papers) are kept.
      #
      # The service only ever writes to a FOLDER. It never connects to a file server itself, so there is no
      # address, user name or password to put here. To keep documents on a network location (a NAS, a Windows
      # share, an office server reached over a VPN), mount that location on the server first, with fstab,
      # systemd or your VPN script, and point NETWORK mode at the mount. The README section "Document folder
      # setup" has ready made fstab lines for SMB and NFS and a VPN checklist.
      #
      # MODE: LOCAL   documents go to the folder in STORAGE_ROOT, on this server's own disk.
      #       NETWORK documents go to STORAGE_NETWORK_DIRECTORY inside the share mounted at
      #               STORAGE_NETWORK_MOUNT_PATH. STORAGE_ROOT is ignored.
      # Any other value stops the service at startup. Folders are never created in LOCAL mode, so a typo in
      # the path cannot start filling the wrong disk. If the folder is missing, uploads fail with
      # 503 PROVIDER_UNAVAILABLE and the startup log says why.
      mode: ${STORAGE_MODE:LOCAL}

      # LOCAL mode only. An existing folder that the user running the service can write to.
      # Example: /var/lib/premisave/onboarding
      # COMMERCIAL_ONBOARDING_STORAGE_PATH is the old name and is still read when STORAGE_ROOT is empty.
      path: ${STORAGE_ROOT:${COMMERCIAL_ONBOARDING_STORAGE_PATH:}}

      # NETWORK mode only.
      network:
        # What kind of share is mounted: SMB (Windows share, Samba, Synology), NFS, SFTP (sshfs),
        # WEBDAV or OTHER (no type check). Used to confirm the mount at the path is the right kind of mount.
        protocol: ${STORAGE_NETWORK_PROTOCOL:SMB}

        # Optional but recommended. When set, the mount's source must contain them, so a different server
        # or share mounted at the same path is refused. Use the same host name or address as in /etc/fstab,
        # for example host 10.8.0.5 (a VPN address) and share premisave on //10.8.0.5/premisave.
        host: ${STORAGE_NETWORK_HOST:}
        share: ${STORAGE_NETWORK_SHARE:}

        # Required. The local folder the share is mounted on, for example /mnt/nas. The mount itself is done
        # outside this service. Use options that survive a missing network at boot (_netdev, nofail) and, over
        # a VPN, x-systemd.automount so the share is mounted again after the VPN comes back.
        mount-path: ${STORAGE_NETWORK_MOUNT_PATH:}

        # Sub folder on the share for this service, for example premisave-wallet. Plain name, no "..".
        # Created on the share at startup if it is missing (only once the share is confirmed mounted).
        # Empty uses the root of the share.
        directory: ${STORAGE_NETWORK_DIRECTORY:}

        # true (default): every read and write first confirms mount-path really is a mounted share of the
        # type above. If the VPN drops or the NAS is down, uploads fail with 503 instead of being saved on
        # this server's local disk. Set false only where mounts cannot be checked (macOS or Windows
        # development machines); the service then writes to the folder whether or not it is a mount.
        require-mount: ${STORAGE_NETWORK_REQUIRE_MOUNT:true}
  recovery-interval-ms: 30000
  expiry-interval-ms: 60000
  # Fee rules per method. Unset methods use the built in placeholder rates,
  # which must be replaced with the agreed pricing before go live.
  # fees:
  #   collection:
  #     MOBILE_MONEY: { percent-bps: 200, flat-cents: 0, min-cents: 10 }
  #   payout:
  #     MOBILE_MONEY: { percent-bps: 100, flat-cents: 20 }